name: Test, Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Manueller Trigger über GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig — kein Überholen bei schnellen Pushes
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─── Job 1: Tests ────────────────────────────────────────────────────────────
jobs:
  test:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript-Typen prüfen
        run: npm run typecheck

      - name: Tests ausführen (1063 Tests)
        run: npm test

# ─── Job 2: Build ────────────────────────────────────────────────────────────
  build:
    name: Build (Single-File + PWA)
    needs: test  # Nur wenn alle Tests grün
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: PWA Build → dist-pwa/ (primäre Erfahrung, deployed at root)
        run: npm run build:pwa
        env:
          # Base-URL für GitHub Pages: /Mathelab/ (Root, nicht /pwa/)
          # PWA ist die primäre Erfahrung — Service Worker + installierbar
          VITE_BASE_URL: /Mathelab/

      - name: Single-File Build → dist/ (Offline-Download)
        run: npm run build

      - name: Ausgaben zusammenführen → _site/
        run: |
          mkdir -p _site/offline
          # PWA → Root (primäre GitHub Pages Erfahrung, installierbar)
          cp -r dist-pwa/. _site/
          # Single-File → /offline/ (Download für lokale Nutzung ohne Internet)
          cp dist/index.html _site/offline/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

# ─── Job 3: Deploy ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
